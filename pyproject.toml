[project]
name = "genesis"
version = "0.1.0"
description = "Transcripción y traducción en vivo para Nerdearla"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "google-genai>=1.0",
  "langfuse>=3",
  "uvicorn>=0.32",
  "websockets>=13",
]

[tool.setuptools.package-data]
genesis = ["overlay.html"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genesis*"]
